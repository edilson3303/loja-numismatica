<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0c"><link rel="icon" type="image/webp" href="/favicon.ico?v=20260901-logo-1"><title>Loja numismática</title><link rel="stylesheet" href="/styles.css?v=20261026-plataforma-1"><script src="/app.js?v=20260901-footer-1" defer></script></head><body class="app-loading"><div id="appLoader" class="app-loader" role="status" aria-live="polite"><div class="app-loader-box"><div class="app-loader-spinner" aria-hidden="true"></div><strong>Preparando o acervo…</strong></div></div>
<header><div class="wrap"><nav class="public-nav"><a id="siteLogoLink" class="site-logo" href="/" aria-label="Página inicial" hidden><img id="siteLogo" alt="Logomarca"></a><a class="btn" href="/como-comprar">Como comprar?</a><button class="btn" id="cartBtn">Carrinho (<span id="count">0</span>)</button></nav></div></header>
<section class="hero"><div class="wrap hero-dynamic" aria-live="polite"><span class="hero-kicker">Acervo selecionado</span><h1 id="brand"></h1><div id="heroDescription" class="hero-description"></div><div class="hero-points" aria-label="Diferenciais da loja"><span>Fotos reais</span><span>Estoque atualizado</span><span>Atendimento especializado</span></div></div></section>

<main class="wrap"><div class="controls"><input id="q" placeholder="Buscar por nome, tipo, país, data, referência..."><select id="productTypeFilter"><option value="todos">Todos os tipos</option><option value="moeda">Moedas</option><option value="cedula">Cédulas</option><option value="medalha">Medalhas</option><option value="ficha">Fichas</option><option value="token">Tokens</option><option value="jeton">Jetons</option><option value="vale">Vales</option><option value="padrao">Padrões / provas / ensaios</option><option value="conjunto">Conjuntos / séries</option><option value="blister">Blisters</option><option value="sache">Sachês / sacos / lotes</option><option value="certificado">Certificados / encartes</option><option value="acessorio">Acessórios</option><option value="outro">Outros</option></select><select id="era"><option value="todas">Todos os períodos</option><option value="colonia">Brasil Colônia</option><option value="imperio">Império</option><option value="republica">República</option><option value="mundo">Numismática mundial</option></select><select id="sort"><option value="name">Nome</option><option value="priceAsc">Menor preço</option><option value="priceDesc">Maior preço</option></select></div><p class="muted" id="resultInfo"></p><div id="grid" class="grid"></div><nav id="pagination" class="pagination" aria-label="Paginação do catálogo" hidden></nav></main>
<footer id="siteFooter" class="site-footer" hidden><div class="wrap"><div id="footerAddress" class="footer-address"></div></div></footer>
<dialog id="cart"><div class="row between"><h2>Carrinho</h2><button class="btn" data-close>Fechar</button></div><div id="cartList"></div><div class="row between"><strong>Total</strong><strong id="total">R$ 0,00</strong></div><hr><div class="form-grid"><div class="field"><label>Nome *</label><input id="customerName"></div><div class="field"><label>Telefone</label><input id="customerPhone"></div><div class="field full"><label>E-mail</label><input id="customerEmail" type="email"></div><div class="field full"><label>Observação</label><textarea id="customerNote"></textarea></div></div><div class="status" id="cartStatus"></div><div class="cart-actions"><button class="btn primary" id="checkout">Registrar pedido</button><button class="btn" id="continueShopping" type="button">Continuar comprando</button></div></dialog>
<dialog id="productDialog" class="product-dialog"><div class="row between"><h2 id="detailTitle">Detalhes</h2><button class="btn" id="closeProduct" type="button">Fechar</button></div><div class="product-detail"><div><div id="detailMain" class="detail-main"></div><div id="detailThumbs" class="detail-thumbs"></div></div><div><div id="detailMeta" class="muted"></div><div id="detailDescription" class="detail-description"></div><div id="detailSpecs" class="detail-specs"></div><div class="row between detail-buy"><strong id="detailPrice" class="price"></strong><button class="btn primary" id="detailAdd" type="button">Adicionar ao carrinho</button></div></div></div></dialog>
</body></html>
