<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0c"><link rel="icon" type="image/webp" href="/favicon.ico?v=20260901-logo-1"><title>Configurar — Loja numismática</title><link rel="stylesheet" href="/styles.css?v=20261026-plataforma-2"></head><body><main class="login"><section class="login-card"><h1>Configuração inicial</h1><p class="muted">Funciona somente enquanto ainda não existe administrador.</p>
<form id="setupForm"><div class="field"><label>Token de instalação</label><input id="token" type="password" autocomplete="off" required></div><div class="field"><label>E-mail do administrador</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha forte</label><input id="password" type="password" autocomplete="new-password" minlength="14" required></div><div class="field"><label>Repita a senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="14" required></div><button class="btn primary" type="submit">Criar administrador</button></form>
<div id="result" hidden><h2>Cadastre o 2FA agora</h2><p>Google Authenticator → <b>+</b> → <b>Inserir chave de configuração</b> → tipo <b>Baseada em tempo</b>.</p><div class="field"><label>Chave TOTP</label><input id="secret" readonly></div><p class="muted">Guarde essa chave em local seguro e não compartilhe. Depois, acesse <a href="/login">o login</a>.</p></div><div id="msg" class="status" role="status"></div><p><a href="/">Voltar ao catálogo</a></p></section></main><script src="/setup.js"></script></body></html>
